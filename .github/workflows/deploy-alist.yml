name: Deploy alist to Unikraft Cloud (Singapore)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kraft (KraftKit)
        run: |
          curl -sL -o /tmp/kraft.tar.gz \
            https://github.com/unikraft/kraftkit/releases/download/v0.12.15/kraft_0.12.15_linux_amd64.tar.gz
          tar -xzf /tmp/kraft.tar.gz -C /tmp
          sudo mv /tmp/kraft /usr/local/bin/kraft
          sudo mv /tmp/kraftld /usr/local/bin/kraftld
          kraft --version

      - name: Create persistent volume (idempotent)
        run: kraft cloud volume create --size 1Gi --name alist-data || true
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}

      - name: Deploy alist to Singapore (sin)
        run: |
          kraft cloud deploy \
            --metro sin \
            -p 5244:5244 \
            -M 512 \
            -v alist-data:/opt/alist/data \
            --restart always \
            --scale-to-zero off \
            -n alist \
            .
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
