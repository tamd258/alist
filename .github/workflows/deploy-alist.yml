name: Deploy alist to Unikraft Cloud (Singapore)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install kraft (KraftKit)
        run: |
          curl -sL -o /tmp/kraft.tar.gz \
            https://github.com/unikraft/kraftkit/releases/download/v0.12.15/kraft_0.12.15_linux_amd64.tar.gz
          tar -xzf /tmp/kraft.tar.gz -C /tmp
          sudo mv /tmp/kraft /usr/local/bin/kraft
          sudo mv /tmp/kraftld /usr/local/bin/kraftld
          kraft version

      - name: Create persistent volume (idempotent)
        run: kraft cloud volume create --size 1Gi --name alist-data < /dev/null || true
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: sin
          KRAFTKIT_NO_PROMPT: "1"
          KRAFTKIT_NO_CHECK_UPDATES: "true"
          KRAFTKIT_LOG_TYPE: basic
          KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"

      - name: Deploy alist to Singapore (sin)
        run: |
          kraft cloud deploy \
            --metro sin \
            -p 5244:5244 \
            -M 512 \
            --rootfs ./Dockerfile.unikraft \
            --runtime base:latest \
            --entrypoint "/opt/alist/alist server --no-prefix" \
            -v alist-data:/opt/alist/data \
            --restart always \
            --scale-to-zero off \
            -n alist \
            . < /dev/null
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: sin
          KRAFTKIT_NO_PROMPT: "1"
          KRAFTKIT_NO_CHECK_UPDATES: "true"
          KRAFTKIT_LOG_TYPE: basic
          KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"
